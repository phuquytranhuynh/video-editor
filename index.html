<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Editor – Local</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="menubar"></div>
<div id="workspace"></div>

<div id="main">
  <div id="colLeft">
    <section class="panel" id="pProject"></section>
    <div class="split h" data-split="projH"></div>
    <section class="panel" id="pEffects"></section>
  </div>
  <div class="split v" data-split="leftW"></div>
  <div id="colRight">
    <div id="rowTop">
      <section class="panel" id="pSource"></section>
      <div class="split v" data-split="srcW"></div>
      <section class="panel" id="pProgram"></section>
      <div class="split v" data-split="propW"></div>
      <section class="panel" id="pProps"></section>
    </div>
    <div class="split h" data-split="topH"></div>
    <div id="rowBottom">
      <div id="toolbar"></div>
      <section class="panel" id="pTimeline"></section>
      <section class="panel" id="pMeter"></section>
    </div>
  </div>
</div>

<div id="dropOverlay">Thả file video / audio / ảnh vào đây để nhập</div>
<div id="toast"></div>
<input type="file" id="fileInput" multiple hidden accept="video/*,audio/*,image/*,.mkv,.mov,.mp4,.webm,.mp3,.wav,.m4a,.aac,.ogg,.png,.jpg,.jpeg,.gif,.webp">
<input type="file" id="projInput" hidden accept=".json,.vedit">

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/media.js"></script>
<script src="js/anim.js"></script>
<script src="js/sfx.js"></script>
<script src="js/auto.js"></script>
<script src="js/stt-align.js"></script>
<script src="js/stt.js"></script>
<script src="js/player.js"></script>
<script src="js/timeline.js"></script>
<script src="js/monitor.js"></script>
<script src="js/panels.js"></script>
<script src="js/inspector.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/exporter.js"></script>
<script src="js/persist.js"></script>
<script src="js/app.js"></script>
</body>
</html>
